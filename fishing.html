<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Haru Fishing RPG · 16-Bit Discord Sync Game</title>
  <meta name="theme-color" content="#0b1523" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Haru Fishing" />
  <link rel="icon" type="image/png" href="./icons/fishing-app-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/fishing-app-icon-180.png" />
  <link rel="manifest" href="./fishing-manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --px-bg: #08101c;
      --px-navy: #0b1523;
      --px-panel: #102033;
      --px-card: #14273d;
      --px-card-hi: #19324d;
      --px-border: #2c4e73;
      --px-border-bright: #6fdbbf;
      --px-cyan: #7ec8d9;
      --px-mint: #6fdbbf;
      --px-gold: #ecc570;
      --px-coral: #f45b69;
      --px-violet: #c6a4e2;
      --px-shadow: #040811;
      --px-text: #f1f5f9;
      --px-text-2: #cbd5e1;
      --px-muted: #84a0bd;
      --font-px: 'VT323', monospace;
      --font-ui: 'Chakra Petch', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    button, input, select, textarea {
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      border-radius: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--px-gold);
      outline-offset: 1px;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--px-bg);
      background-image:
        radial-gradient(rgba(111, 219, 191, 0.06) 1px, transparent 1px),
        radial-gradient(rgba(126, 200, 217, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: var(--px-text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: none;
      min-height: 100vh;
      overflow-x: clip;
    }

    .px-num {
      font-family: var(--font-px);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }

    img, .sprite-box img, .sprite-sm img, .px-icon {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .px-svg {
      display: inline-block;
      vertical-align: -0.18em;
      flex-shrink: 0;
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }
    .hud-label > span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .inline-ico {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Pixel Top Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: #091320;
      border-bottom: 3px solid var(--px-border);
      box-shadow: 0 4px 0 var(--px-shadow);
      padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
    }
    .nav-inner {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--px-text-2);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 10px;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.14), inset -1px -1px 0 rgba(0, 0, 0, 0.35), 2px 2px 0 var(--px-shadow);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand-back:hover { color: var(--px-mint); border-color: var(--px-mint); }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title .px-logo-text {
      font-family: var(--font-px);
      font-size: 24px;
      line-height: 1;
      color: var(--px-gold);
      text-shadow: 2px 2px 0 var(--px-shadow);
    }
    .brand-title img {
      width: 32px;
      height: 32px;
      border: 2px solid var(--px-mint);
      background: var(--px-navy);
      flex-shrink: 0;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      color: var(--px-text-2);
      white-space: nowrap;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      background: #64748b;
      flex-shrink: 0;
    }
    .sync-pill.online { border-color: var(--px-mint); color: var(--px-mint); }
    .sync-pill.online .sync-dot { background: var(--px-mint); box-shadow: 0 0 6px var(--px-mint); }
    .sync-pill.offline { border-color: var(--px-coral); color: #fda4af; }
    .sync-pill.offline .sync-dot { background: var(--px-coral); }

    .lang-wrap {
      display: inline-flex;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--px-muted);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--px-mint);
      color: #07131e;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px 3px 4px;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--px-text);
    }
    .user-chip img {
      width: 22px;
      height: 22px;
      border: 1px solid var(--px-cyan);
      object-fit: cover;
    }

    /* Pixel Beveled Arcade Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 700;
      border: 2px solid var(--px-border);
      box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.15), inset -2px -2px 0 rgba(0, 0, 0, 0.36), 3px 3px 0 var(--px-shadow);
      cursor: pointer;
      transition: transform 0.06s steps(2), box-shadow 0.06s steps(2), border-color 0.12s ease;
      text-decoration: none;
      color: var(--px-text);
      background: var(--px-card);
      white-space: nowrap;
      border-radius: 0;
    }
    .btn:hover:not(:disabled) { border-color: var(--px-mint); color: #fff; }
    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.36), 1px 1px 0 var(--px-shadow);
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-primary {
      background: #175c78;
      border-color: var(--px-cyan);
      color: #fff;
    }
    .btn-gold {
      background: #c89128;
      border-color: #ffe28a;
      color: #091320;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .btn-gold:hover:not(:disabled) { color: #091320; border-color: #fff4b8; background: #dba12f; }
    .btn-emerald {
      background: #176b5b;
      border-color: var(--px-mint);
      color: #e6fff9;
    }
    .btn-danger {
      background: #732030;
      border-color: var(--px-coral);
      color: #ffd4d8;
    }
    .btn-ghost {
      background: var(--px-panel);
      border-color: var(--px-border);
      color: var(--px-text-2);
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 11.5px;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.14), inset -1px -1px 0 rgba(0, 0, 0, 0.34), 2px 2px 0 var(--px-shadow);
    }

    /* Shell */
    .shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    /* Pixel Box & Cards */
    .panel {
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      box-shadow: 4px 4px 0 var(--px-shadow), inset 0 0 0 1px rgba(126, 200, 217, 0.08);
      padding: 16px;
      position: relative;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(111, 219, 191, 0.14);
      pointer-events: none;
    }
    .sub-card {
      background: var(--px-card);
      border: 2px solid var(--px-border);
      box-shadow: 3px 3px 0 var(--px-shadow);
      padding: 12px;
      position: relative;
    }

    /* Pixel HUD Strip */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .hud-stat {
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      box-shadow: 3px 3px 0 var(--px-shadow);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .hud-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--px-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .hud-val {
      font-family: var(--font-px);
      font-size: 23px;
      line-height: 1.05;
      color: var(--px-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-val.text-sm-val {
      font-family: var(--font-ui);
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.25;
    }
    .hud-sub {
      font-size: 11px;
      color: var(--px-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .xp-track {
      width: 100%;
      height: 8px;
      background: #060d18;
      border: 1px solid var(--px-border);
      margin-top: 2px;
    }
    .xp-fill {
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        var(--px-mint) 0px,
        var(--px-mint) 6px,
        #4ab89a 6px,
        #4ab89a 8px
      );
      transition: width 0.25s steps(10);
    }

    /* Desktop Tab Strip */
    .rpg-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .rpg-tabs::-webkit-scrollbar { display: none; }
    .rpg-tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.1), inset -2px -2px 0 rgba(0, 0, 0, 0.35), 3px 3px 0 var(--px-shadow);
      color: var(--px-text-2);
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .rpg-tab:hover { border-color: var(--px-cyan); color: #fff; }
    .rpg-tab.active {
      background: #14364a;
      border-color: var(--px-mint);
      color: var(--px-mint);
      transform: translate(1px, 1px);
      box-shadow: inset 2px 2px 0 rgba(111, 219, 191, 0.22), 2px 2px 0 var(--px-shadow);
    }
    .tab-badge {
      padding: 1px 6px;
      font-family: var(--font-px);
      font-size: 14px;
      line-height: 1;
      background: #091320;
      border: 1px solid var(--px-border);
      color: var(--px-gold);
    }

    /* Pixel Mobile Game Hotbar (only <= 768px) */
    #px-mobile-hotbar {
      display: none;
    }

    /* Dedicated Compact Fishing HUD Strip (Fish Tab Only) */
    .fish-hud-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 8px 12px;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      box-shadow: 3px 3px 0 var(--px-shadow);
      margin-bottom: 12px;
    }
    .fish-hud-chips {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      min-width: 0;
    }
    .fish-hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--px-text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .xp-track-sm {
      width: 44px;
      height: 6px;
      background: #060d18;
      border: 1px solid var(--px-border);
      overflow: hidden;
    }
    .xp-track-sm > div {
      height: 100%;
      background: var(--px-mint);
    }

    /* Focused Single-Column Fishing Sanctuary */
    .fish-sanctuary {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .waters-stage {
      background: #0a1829;
      border: 2px solid var(--px-mint);
      box-shadow: 4px 4px 0 var(--px-shadow), inset 0 0 0 2px #0f2942;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .waters-stage[data-island="swamp_island"] { border-color: #6ee7b7; background: #091a16; }
    .waters-stage[data-island="arctic_island"] { border-color: #7dd3fc; background: #091a2a; }
    .waters-stage[data-island="abyssal_island"] { border-color: #818cf8; background: #070b1c; }
    .waters-stage[data-island="volcanic_island"] { border-color: #f97316; background: #1c0c12; }
    .waters-stage[data-island="astral_island"] { border-color: #c6a4e2; background: #100b22; }

    .px-stage-wrap {
      position: relative;
      border: 2px solid var(--px-border);
      background: #06101e;
      overflow: hidden;
      line-height: 0;
      box-shadow: inset 0 0 0 1px rgba(126, 200, 217, 0.14);
    }
    #px-ocean-canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 384 / 210;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #px-stage-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    .stage-tag-bl {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      padding: 3px 8px;
      background: rgba(6, 16, 30, 0.78);
      border: 1.5px solid var(--px-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--px-cyan);
      line-height: 1.25;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .stage-streak-br {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      padding: 3px 8px;
      background: rgba(20, 12, 6, 0.85);
      border: 1.5px solid var(--px-gold);
      font-family: var(--font-px);
      font-size: 16px;
      line-height: 1;
      color: var(--px-gold);
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    @keyframes stageShakeSm {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-2px, -1px); }
    }
    @keyframes stageShakeLg {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-5px, 3px); }
      30% { transform: translate(5px, -4px); }
      45% { transform: translate(-4px, -2px); }
      60% { transform: translate(4px, 3px); }
      75% { transform: translate(-3px, 2px); }
    }
    .stage-shake-sm { animation: stageShakeSm 0.34s steps(2); }
    .stage-shake-lg { animation: stageShakeLg 0.52s steps(2); }

    /* Mini-Game Challenge UI */
    .mg-shell {
      width: 100%;
      max-width: 520px;
      background: #0a1728;
      border: 3px solid var(--px-gold);
      box-shadow: 5px 5px 0 var(--px-shadow);
      padding: 12px;
      text-align: left;
    }
    .mg-canvas-box {
      margin: 10px 0;
      border: 2px solid var(--px-border);
      background: #050c17;
      line-height: 0;
    }
    #mg-canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 300 / 156;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .mg-pad {
      width: 100%;
      padding: 13px 12px;
      font-size: 13px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .mg-lanes-pads {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .mg-lane-btn {
      padding: 12px 4px;
      font-size: 12px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .island-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--px-border);
    }
    .stage-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 4px 0;
    }

    .cast-btn-main {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 280px;
      padding: 14px 30px;
      font-family: var(--font-px);
      font-size: 27px;
      line-height: 1;
      background: #1a6b8a;
      color: #fff;
      border: 3px solid var(--px-mint);
      box-shadow: inset 3px 3px 0 rgba(184, 242, 255, 0.26), inset -3px -3px 0 rgba(4, 8, 17, 0.45), 5px 5px 0 var(--px-shadow);
      cursor: pointer;
      transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
      text-shadow: 2px 2px 0 var(--px-shadow);
    }
    .cast-btn-main .cast-cd-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--cd-pct, 0%);
      background: rgba(111, 219, 191, 0.24);
      pointer-events: none;
      transition: width 0.14s linear;
    }
    .cast-btn-main .cast-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .cast-btn-main .cast-key-hint {
      position: relative;
      z-index: 1;
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border: 1px solid rgba(184, 242, 255, 0.45);
      background: rgba(7, 17, 30, 0.72);
      color: var(--px-cyan);
      letter-spacing: 0.05em;
    }
    .cast-btn-main:hover:not(:disabled) { background: #1f7b9e; }
    .cast-btn-main:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--px-shadow);
    }
    .cast-btn-main:disabled { opacity: 0.7; cursor: not-allowed; box-shadow: none; }
    .cast-btn-main:disabled .cast-key-hint { display: none; }

    /* Quick Fishing Utility Dock & Live Session Strip */
    .fish-quick-dock {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding-top: 10px;
      border-top: 2px solid var(--px-border);
    }
    .dock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 10px;
      background: var(--px-panel);
      border: 2px solid var(--px-border);
      box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.1), inset -2px -2px 0 rgba(0, 0, 0, 0.36), 2px 2px 0 var(--px-shadow);
      color: var(--px-text);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  <script>
    const CLIENT_ID = "1573727590538289283";
    const REDIRECT_URI = "https://haruki070909.github.io/haruki-legal/dashboard.html";
    const GATEWAY_URL = "https://sepay-webhook-p0o1.onrender.com";

    // Standalone game PWA detection (hides Haru Ecosystem back button when installed/running as App)
    try {
      const qsBoot = new URLSearchParams(window.location.search);
      if (qsBoot.get("source") === "game_pwa") {
        sessionStorage.setItem("haru_fishing_pwa_mode", "1");
      }
    } catch (_) {}
    const isStandaloneGame = Boolean(
      (window.matchMedia && (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches
      )) ||
      window.navigator.standalone === true ||
      sessionStorage.getItem("haru_fishing_pwa_mode") === "1"
    );
    if (isStandaloneGame) {
      document.documentElement.classList.add("is-standalone");
    }
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).then((reg) => {
          if (reg && typeof reg.update === "function") reg.update().catch(() => {});
        }).catch(() => {});
      });
    }

    let deferredGameInstall = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredGameInstall = e;

    window.addEventListener("appinstalled", () => {
      deferredGameInstall = null;

    // Lightweight 8-Bit Chiptune WebAudio SFX
    const SFX = {
      enabled: localStorage.getItem("haru_fish_sfx") !== "0",
      ctx: null,
      tone(freq, dur, type, delay, vol) {
        if (!this.enabled) return;
        try {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
          }
          if (this.ctx.state === "suspended") this.ctx.resume();
          const t0 = this.ctx.currentTime + (delay || 0);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type || "square";
          osc.frequency.setValueAtTime(freq, t0);
          gain.gain.setValueAtTime(vol || 0.05, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + (dur || 0.1));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t0);
          osc.stop(t0 + (dur || 0.1) + 0.02);
        } catch (_) {}
      },
      cast() {
        this.tone(420, 0.07, "square", 0, 0.04);
        this.tone(620, 0.09, "square", 0.06, 0.04);
        this.tone(240, 0.12, "triangle", 0.14, 0.06);
      },
      catch(rare) {
        this.tone(523, 0.08, "square", 0, 0.05);
        this.tone(659, 0.08, "square", 0.08, 0.05);
        this.tone(784, 0.12, "square", 0.16, 0.05);
        if (rare) this.tone(1046, 0.22, "square", 0.26, 0.06);
      },
      coin() {
        this.tone(987, 0.06, "square", 0, 0.04);
        this.tone(1318, 0.16, "square", 0.06, 0.05);
      },
      miss() {
        this.tone(260, 0.1, "sawtooth", 0, 0.04);
        this.tone(175, 0.16, "sawtooth", 0.09, 0.04);
      },
      forge() {
        this.tone(440, 0.07, "triangle", 0, 0.06);
        this.tone(880, 0.14, "square", 0.07, 0.05);
      },
      bite() {
        this.tone(587, 0.06, "square", 0, 0.05);
        this.tone(880, 0.08, "square", 0.05, 0.06);
        this.tone(1174, 0.11, "square", 0.11, 0.05);
      },
      hit(combo) {
        const base = 540 + Math.min(8, Number(combo || 1)) * 75;
        this.tone(base, 0.06, "square", 0, 0.05);
        this.tone(base * 1.25, 0.09, "square", 0.045, 0.05);
      },
      tick() {
        this.tone(360, 0.035, "triangle", 0, 0.03);
      },
      phaseClear() {
        this.tone(523, 0.07, "square", 0, 0.05);
        this.tone(659, 0.07, "square", 0.07, 0.05);
        this.tone(784, 0.07, "square", 0.14, 0.05);
        this.tone(1046, 0.18, "square", 0.21, 0.06);
      },
      snap() {
        this.tone(310, 0.1, "sawtooth", 0, 0.06);
        this.tone(220, 0.12, "sawtooth", 0.09, 0.06);
        this.tone(140, 0.24, "sawtooth", 0.19, 0.06);
      },
      rarityFanfare(rank, value) {
        const r = Number(rank || 1);
        const val = Number(value || 0);
        if (r <= 2) {
          this.tone(523, 0.07, "square", 0, 0.04);
          this.tone(659, 0.11, "square", 0.06, 0.04);
        } else if (r === 3) {
          [523, 659, 784].forEach((f, i) => this.tone(f, 0.09, "square", i * 0.07, 0.05));
        } else if (r === 4) {
          [523, 622, 784, 932].forEach((f, i) => this.tone(f, 0.1, "square", i * 0.065, 0.055));
        } else if (r === 5) {
          [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.12, "square", i * 0.065, 0.06));
        } else if (r <= 7) {
          [440, 523, 659, 880, 1046, 1318].forEach((f, i) => this.tone(f, 0.13, "sawtooth", i * 0.06, 0.055));
        } else {
          [523, 659, 784, 988, 1046, 1318, 1568, 2093].forEach((f, i) => this.tone(f, 0.15, "square", i * 0.055, 0.06));
        }
        if (val >= 50000) {
          this.tone(1568, 0.08, "triangle", 0.35, 0.05);
          this.tone(2093, 0.18, "triangle", 0.42, 0.06);
        }
      }
    };
    window.SFX = SFX;

      return String(s == null ? "" : s)

      const key = pxEmojiKey(emoji);

    function toast(msg, kind, iconName) {
      const wrap = document.getElementById("toast-wrap");
      const el = document.createElement("div");
      el.className = "toast" + (kind ? " " + kind : "");
      const ico = iconName || (kind === "ok" ? "check" : (kind === "err" ? "warn" : "sparkle"));
      const txt = document.createElement("span");
      txt.textContent = msg;
      el.innerHTML = pxIcon(ico, 16);
      el.appendChild(txt);
      wrap.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
    }

    async function runNativeInstallPrompt() {
      if (!deferredGameInstall) return;
      const p = deferredGameInstall;
      deferredGameInstall = null;
      try {
        await p.prompt();
        const choice = await p.userChoice;
        if (choice && choice.outcome === "accepted") {
          closeModal();
        }
      } catch (_) {}
    }

      if (!forceModal && deferredGameInstall) {
        try {
          const p = deferredGameInstall;
          deferredGameInstall = null;
          await p.prompt();
          await p.userChoice;
          return;
        } catch (_) {}
      }
      const ua = navigator.userAgent || "";
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      render();

    async function fetchWithTimeout(url, opts, timeoutMs) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs || 8000);
      try {
        return await fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal }));
      } finally {
        clearTimeout(timer);
      }
    }

    async function checkBridgeHealth() {
      const pill = document.getElementById("bridge-pill");
      const lbl = document.getElementById("bridge-label");
      try {
        const res = await fetchWithTimeout(`${GATEWAY_URL}/api/harubot/fish/health`, { cache: "no-store" }, 7000);
        const data = await res.json();
        APP.bridgeOnline = Boolean(data && data.bridge_online);
        pill.className = "sync-pill " + (APP.bridgeOnline ? "online" : "offline");
        lbl.textContent = APP.bridgeOnline ? t("bridgeOnline") : t("bridgeOffline");
      } catch (_) {
        APP.bridgeOnline = false;
        pill.className = "sync-pill offline";
        lbl.textContent = t("bridgeOffline");
      }
    }

    async function fishRpc(action, payload) {
      const reqPayload = Object.assign(APP.guildId ? { guild_id: APP.guildId } : {}, payload || {});
      const enqRes = await fetchWithTimeout(`${GATEWAY_URL}/api/harubot/fish/enqueue`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${APP.token}`
        },
        body: JSON.stringify({ action, payload: reqPayload })
      }, 8000);

      if (enqRes.status === 401) {
        logoutDiscord();
        throw new Error(APP.lang === "en" ? "Discord session expired. Please sign in again." : "Phiên Discord hết hạn. Vui lòng đăng nhập lại.");
      }

      const enq = await enqRes.json().catch(() => ({ ok: false, error: `HTTP ${enqRes.status}` }));
      if (!enqRes.ok || !enq.ok || !enq.job_id) {
        throw new Error(enq.error || `Gateway error (HTTP ${enqRes.status})`);
      }

      const maxMs = enq.bridge_online ? 15000 : 5000;
      const started = Date.now();
      while (Date.now() - started < maxMs) {
        await new Promise(r => setTimeout(r, 160));
        const resRes = await fetchWithTimeout(`${GATEWAY_URL}/api/harubot/fish/result/${encodeURIComponent(enq.job_id)}`, {
          headers: { Authorization: `Bearer ${APP.token}` },
          cache: "no-store"
        }, 7000);
        if (resRes.status === 401) {
          logoutDiscord();
          throw new Error(APP.lang === "en" ? "Discord session expired. Please sign in again." : "Phiên Discord hết hạn. Vui lòng đăng nhập lại.");
        }
        const poll = await resRes.json().catch(() => null);
        if (poll && (poll.status === "done" || poll.status === "error")) {
          const data = poll.result || { ok: false, error: "Empty response" };
          if (data && data.state) applyState(data.state);
          return data;
        }
      }
      return {
        ok: false,
        error: APP.lang === "en"
          ? "HaruBot bridge offline or timed out waiting for bot reply."
          : "HaruBot Bridge đang ngoại tuyến hoặc phản hồi quá thời gian."
      };
    }

    const RARITY_RANKS = {
      common: 1, uncommon: 2, rare: 3, epic: 4, legendary: 5,
      mythic: 6, ancient: 7, transcendent: 8, eternity: 9,
      infinity: 10, genesis: 11, omega: 12
    };
    function rarityRankOf(rid) {
      return RARITY_RANKS[String(rid || "").toLowerCase()] || 1;
    }
    function rarityTierClass(rid) {
      const k = String(rid || "common").toLowerCase();
      const rk = rarityRankOf(k);
      if (rk >= 8) return "tier-cosmic";
      if (rk >= 6) return "tier-mythic";
      return "tier-" + k;
    }
    function valueBadgeHtml(val) {
      const v = Number(val || 0);
      if (v >= 500000) return `<span class="rarity-pill value-badge-jackpot">${pxIcon("crown", 12)} SIÊU JACKPOT</span>`;
      if (v >= 50000) return `<span class="rarity-pill value-badge-gold">${pxIcon("gem", 12)} ĐẠI GIA</span>`;
      if (v >= 5000) return `<span class="rarity-pill value-badge-hot">${pxIcon("coin", 12)} CÁ XỊN</span>`;
      return "";
    }

    function applyState(st) {
      APP.state = st;
      APP.lastError = "";
      if (st && st.context && st.context.guild_id) {
        APP.guildId = st.context.guild_id;
        localStorage.setItem("harubot_fish_guild_id", APP.guildId);
      }
      if (st && st.stats) {
        const rem = Number(st.stats.cooldown_remaining || 0);
        const cdSec = Number(st.stats.cooldown_seconds || 1.5);
        APP.cooldownDurationMs = Math.max(500, Math.round(cdSec * 1000));
        APP.cooldownUntilMs = rem > 0 ? (Date.now() + rem * 1000) : 0;
      }
      if (st && st.weather) {
        APP.weatherExpiresMs = Date.now() + Number(st.weather.remaining_seconds || 0) * 1000;
      }
      APP.afkEndsMs = (st && st.afk && st.afk.active && st.afk.ends_at)
        ? (Number(st.afk.ends_at) * 1000)
        : 0;
      if (st && st.pending_catch && !APP.activeChallenge && !APP.busyAction) {
        const p = st.pending_catch;
        APP.activeChallenge = {
          pending_id: p.pending_id,
          expected_move: p.expected_move,
          bonus_count: p.bonus_count || 0,
          legacyTension: false,
          catch_preview: {
            fish_id: p.fish_id,
            fish_name: p.fish_name,
            rarity_id: p.rarity_id,
            rarity_name: p.rarity_name,
            rarity_color: p.rarity_color,
            weight: p.weight,
            value: p.value,
            image_path: p.image_path,
            mutation_name: p.mutation_name
          }
        };
      } else if (st && !st.pending_catch && APP.activeChallenge && !APP.activeChallenge.practice && !HaruMiniGame.isActive() && !APP.busyAction) {
        APP.activeChallenge = null;
      }
    }

    async function bootstrap() {
      const backSlot = document.getElementById("ico-back-slot");
      if (backSlot) backSlot.innerHTML = pxIcon("back", 13);
      const instSlot = document.getElementById("ico-install-slot");
      if (instSlot) instSlot.innerHTML = pxIcon("download", 14);
      const sfxBtn = document.getElementById("btn-sfx");
      if (sfxBtn) sfxBtn.innerHTML = pxIcon(SFX.enabled ? "sound_on" : "sound_off", 15);

      setLang(APP.lang);
      checkBridgeHealth();
      setInterval(checkBridgeHealth, 25000);

      try {
        const sp = new URLSearchParams(window.location.search);
        if (sp.get("install") === "1" && !isStandaloneGame) {
          sp.delete("install");
          const cleanQs = sp.toString();
          window.history.replaceState(null, "", window.location.pathname + (cleanQs ? "?" + cleanQs : ""));
          setTimeout(() => triggerInstallGame(true), 220);
        }
      } catch (_) {}

      if (window.location.hash && window.location.hash.includes("access_token=")) {
        const hp = new URLSearchParams(window.location.hash.substring(1));
        const htok = hp.get("access_token");
        if (htok) {
          localStorage.setItem("discord_access_token", htok);
          APP.token = htok;
          window.history.replaceState(null, "", window.location.pathname);
        }
      }

      if (!APP.token) {
        render();
        return;
      }

      renderLoading(APP.lang === "en" ? "Verifying Discord & syncing real Fishing data..." : "Đang xác thực Discord & đồng bộ dữ liệu câu cá thật...");
      try {
        const uRes = await fetchWithTimeout("https://discord.com/api/v10/users/@me", {
          headers: { Authorization: `Bearer ${APP.token}` }
        }, 8000);
        if (!uRes.ok) {
          logoutDiscord();
          return;
        }
        APP.discordUser = await uRes.json();
        renderNavAuth();
        await loadState();
      } catch (e) {
        APP.lastError = (e && e.name === "AbortError")
          ? (APP.lang === "en" ? "Connection timed out while contacting Discord/Gateway." : "Quá thời gian kết nối Discord hoặc Gateway.")
          : (e.message || "Lỗi kết nối");
        toast(APP.lastError, "err");
        render();
      }
    }

    async function loadState() {
      try {
        const data = await fishRpc("get_state", {});
        if (!data.ok) {
          APP.lastError = data.error || "Không tải được dữ liệu từ HaruBot";
          toast(APP.lastError, "err");
        } else {
          applyState(data);
          APP.bridgeOnline = true;
          document.getElementById("bridge-pill").className = "sync-pill online";
          document.getElementById("bridge-label").textContent = t("bridgeOnline");
        }
      } catch (e) {
        APP.lastError = (e && e.name === "AbortError")
          ? (APP.lang === "en" ? "Gateway request timed out." : "Kết nối tới Gateway bị quá thời gian.")
          : (e.message || "Không kết nối được tới HaruBot Bridge");
        toast(APP.lastError, "err");
      }
      render();
    }

    function formatDurationHMS(sec) {
      const s = Math.max(0, Math.floor(Number(sec || 0)));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const rem = s % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(rem).padStart(2, "0")}`;
    }

    function stopIdleFishing(silent) {
      if (APP.idleTimerId) {
        clearTimeout(APP.idleTimerId);
        APP.idleTimerId = null;
      }
      APP.idleMode = false;
      APP.busyIdle = false;
      if (window.HaruOceanStage && !APP.busyCast && !APP.activeChallenge) {
        HaruOceanStage.setMode("idle");
      }
      if (!silent) render();

    function toggleIdleFishing() {
      if (APP.idleMode) {
        stopIdleFishing(false);
        toast(APP.lang === "en" ? "Idle Auto-Fishing stopped." : "Đã tắt Idle Câu Cá Tự Động.", "", "rod");
        return;
      }
      if (!APP.state) return;
      if (APP.activeChallenge || APP.state.pending_catch) {
        toast(APP.lang === "en" ? "Finish your current bite first!" : "Hãy xử lý con cá đang cắn câu trước!", "err", "warn");
        return;
      }
      APP.idleMode = true;
      SFX.cast();
      if (window.HaruOceanStage) HaruOceanStage.setMode("casting");
      toast(APP.lang === "en" ? "Idle Auto-Fishing ON!" : "Bật Idle Câu Cá Tự Động! Bot tự thả cần & thưởng RuCoin mỗi nhịp.", "ok", "bolt");
      render();
      scheduleNextIdle(350);
    }

    function scheduleNextIdle(delayMs) {
      if (APP.idleTimerId) {
        clearTimeout(APP.idleTimerId);
        APP.idleTimerId = null;
      }
      if (!APP.idleMode || APP.activeTab !== "fish" || !APP.state) return;
      APP.idleTimerId = setTimeout(runIdleCycle, Math.max(250, Number(delayMs || 1500)));
    }

    async function runIdleCycle() {
      APP.idleTimerId = null;
      if (!APP.idleMode || APP.activeTab !== "fish" || !APP.state) return;
      if (APP.busyCast || APP.busyAction || APP.activeChallenge || APP.busyIdle) {
        scheduleNextIdle(900);
        return;
      }
      const localCdMs = Number(APP.cooldownUntilMs || 0) - Date.now();
      if (localCdMs > 250) {
        scheduleNextIdle(localCdMs + 150);
        return;
      }
      APP.busyIdle = true;
      if (window.HaruOceanStage) HaruOceanStage.setMode("casting");
      try {
        const res = await fishRpc("idle_tick", {});
        if (!APP.idleMode || APP.activeTab !== "fish") return;
        if (!res.ok) {
          if (res.code === "cooldown" && Number(res.remaining_seconds || 0) > 0) {
            APP.cooldownUntilMs = Date.now() + Math.ceil(Number(res.remaining_seconds) * 1000);
            scheduleNextIdle(Math.ceil(Number(res.remaining_seconds) * 1000) + 250);
            return;
          }
          toast(res.error || "Idle tạm dừng", "err", "warn");
          stopIdleFishing(false);
          return;
        }
        if (res.state) applyState(res.state);
        APP.inventory = null;
        APP.lastCastResult = res;
        let pendingBurst = null;
        if (res.mode === "idle_caught" && res.catch) {
          const c = res.catch;
          const rk = rarityRankOf(c.rarity_id);
          const totalVal = Number(c.value || 0) + Number(res.idle_rucoin_bonus || 0);
          recordSessionCatch(c, res);
          SFX.rarityFanfare(rk, totalVal);
          pendingBurst = [c.rarity_id, rk, c.rarity_color, totalVal, Boolean(c.mutation_name), "IDLE AUTO!"];
        }
        render();
        if (window.HaruOceanStage && pendingBurst) {
          HaruOceanStage.triggerCatchBurst(...pendingBurst);
        }
        const nextWait = Math.max(2200, (Number(APP.cooldownUntilMs || 0) - Date.now()) + 300);
        scheduleNextIdle(nextWait);
      } catch (e) {
        if (APP.idleMode) {
          toast(e.message || "Lỗi kết nối Idle", "err", "warn");
          scheduleNextIdle(4000);
        }
      } finally {
        APP.busyIdle = false;
      }
    }

    function recordSessionCatch(c, res) {
      if (!c) return;
      const bonuses = (res && res.bonus_catches) || [];
      const totalVal = Number(c.value || 0) + bonuses.reduce((s, b) => s + Number(b.value || 0), 0);
      const ss = APP.sessionStats;
      ss.catches += 1 + bonuses.length;
      ss.totalValue += totalVal;
      ss.streak += 1;
      if (ss.streak > ss.bestStreak) ss.bestStreak = ss.streak;
      ss.recent.unshift({
        fish_name: c.fish_name || "Fish",
        rarity_id: c.rarity_id || "common",
        rarity_color: c.rarity_color || "#7ec8d9",
        value: Number(c.value || 0),
        mutation_name: c.mutation_name || ""
      });
      if (ss.recent.length > 8) ss.recent.length = 8;
    }

    function recordSessionEscape() {
      APP.sessionStats.streak = 0;
    }

    async function doCast() {
      if (APP.busyCast || APP.busyAction || APP.activeChallenge || (APP.cooldownUntilMs > Date.now())) return;
      if (APP.idleMode) stopIdleFishing(true);
      SFX.cast();
      APP.busyCast = true;
      APP.lastCastResult = null;
      if (window.HaruOceanStage) HaruOceanStage.setMode("casting");
      render();
      let pendingBurst = null;
      let pendingEscape = null;
      try {
        const res = await fishRpc("cast", { web_challenge: true });
        if (!res.ok) {
          SFX.miss();
          if (res.code === "cooldown" && res.remaining_seconds) {
            APP.cooldownDurationMs = Math.max(500, Math.round(res.remaining_seconds * 1000));
            APP.cooldownUntilMs = Date.now() + res.remaining_seconds * 1000;
          }
          toast(res.error || "Không thả cần được", "err");
          return;
        }
        APP.inventory = null;
        if (res.mode === "web_challenge" || res.mode === "tension") {
          const prev = res.catch_preview || {};
          APP.activeChallenge = {
            pending_id: res.pending_id,
            catch_preview: prev,
            bonus_count: res.bonus_count || 0,
            expected_move: res.expected_move,
            legacyTension: res.mode === "tension"
          };
          SFX.bite();
          if (window.HaruOceanStage) {
            HaruOceanStage.setMode("hooked", {
              rarityColor: prev.rarity_color || "#6fdbbf",
              rarityRank: rarityRankOf(prev.rarity_id)
            });
          }
          return;
        }

        APP.lastCastResult = res;
        if (res.mode === "caught" && res.catch) {
          const c = res.catch;
          const totalVal = Number(c.value || 0) + (res.bonus_catches || []).reduce((s, b) => s + Number(b.value || 0), 0);
          const rk = rarityRankOf(c.rarity_id);
          recordSessionCatch(c, res);
          SFX.rarityFanfare(rk, totalVal);
          pendingBurst = [c.rarity_id, rk, c.rarity_color, totalVal, Boolean(c.mutation_name), (c.rarity_name || "").toUpperCase() + "!"];
        } else if (res.mode === "chest" || res.mode === "direct_reward") {
          SFX.rarityFanfare(5, 25000);
          pendingBurst = ["legendary", 5, "#ecc570", 25000, false, res.mode === "chest" ? "RƯƠNG BÁU!" : "TRANG BỊ!"];
        } else if (res.mode === "line_snapped") {
          recordSessionEscape();
          SFX.snap();
          pendingEscape = "ĐỨT DÂY!";
        }
        if (res.level_up) toast(`LEVEL UP! Đạt cấp ${res.level}!`, "ok", "party");
      } catch (e) {
        SFX.miss();
        toast(e.message || "Lỗi kết nối khi thả cần", "err");
      } finally {
        APP.busyCast = false;
        render();
        if (window.HaruOceanStage) {
          if (pendingBurst) HaruOceanStage.triggerCatchBurst(...pendingBurst);
          else if (pendingEscape) HaruOceanStage.triggerEscape(pendingEscape);
        }
      }
    }

    async function finishWebChallenge(result) {
      const ch = APP.activeChallenge;
      if (!ch || APP.busyAction) return;

      if (ch.practice) {
        APP.activeChallenge = null;
        const pv = ch.catch_preview || {};
        const rk = rarityRankOf(pv.rarity_id);
        render();
        if (result && result.won) {
          SFX.rarityFanfare(rk, 0);
          if (window.HaruOceanStage) {
            HaruOceanStage.triggerCatchBurst(pv.rarity_id, rk, pv.rarity_color, 0, false, "LUYỆN XONG!");
          }
          toast(`Luyện ${pv.rarity_name || ""} thành công!`, "ok", "trophy");
        } else {
          SFX.snap();
          if (window.HaruOceanStage) HaruOceanStage.triggerEscape("TRƯỢT TẬP!");
          toast(`Thất bại ở chế độ luyện tập (${pv.rarity_name || ""}).`, "err", "puff");
        }
        return;
      }

      APP.activeChallenge = null;
      APP.busyAction = true;
      render();
      let pendingBurst = null;
      let pendingEscape = null;
      try {
        let res = await fishRpc("resolve_challenge", {
          pending_id: ch.pending_id,
          won: Boolean(result && result.won),
          score: (result && result.score) || 0
        });
        if (!res.ok && String(res.error || "").includes("Unknown action")) {
          if (result && result.won && ch.expected_move) {
            res = await fishRpc("tension_step", { pending_id: ch.pending_id, move: ch.expected_move });
          } else {
            await fishRpc("abandon_pending", { pending_id: ch.pending_id });
            res = { ok: true, mode: "challenge_lost", lost_fish: ch.catch_preview || {} };
          }
        }
        if (!res.ok) {
          SFX.miss();
          toast(res.error || "Không chốt được kết quả thử thách", "err");
          return;
        }
        APP.inventory = null;
        APP.lastCastResult = res;

        if (res.mode === "caught" && res.catch) {
          const c = res.catch;
          const totalVal = Number(c.value || 0) + (res.bonus_catches || []).reduce((s, b) => s + Number(b.value || 0), 0);
          const rk = rarityRankOf(c.rarity_id);
          recordSessionCatch(c, res);
          SFX.rarityFanfare(rk, totalVal);
          pendingBurst = [c.rarity_id, rk, c.rarity_color, totalVal, Boolean(c.mutation_name), (c.rarity_name || "").toUpperCase() + "!"];
          toast(`${c.fish_name} (+${fmt(res.gained_xp)} XP)`, "ok", rk >= 5 ? "trophy" : "fish");
          if (res.level_up) toast(`LEVEL UP! Đạt cấp ${res.level}!`, "ok", "party");
        } else if (res.mode === "challenge_lost" || res.mode === "tension_lost") {
          recordSessionEscape();
          SFX.snap();
          pendingEscape = "TUỘT DÂY!";
          const lf = res.lost_fish || {};
          toast(
            lf.fish_name ? `${lf.fish_name} đã giật đứt dây thoát mất!` : "Cá đã giật đứt dây thoát mất!",
            "err",
            "puff"
          );
        }
      } catch (e) {
        SFX.miss();
        toast(e.message || "Lỗi đồng bộ kết quả thử thách", "err");
      } finally {
        APP.busyAction = false;
        render();
        if (window.HaruOceanStage) {
          if (pendingBurst) HaruOceanStage.triggerCatchBurst(...pendingBurst);
          else if (pendingEscape) HaruOceanStage.triggerEscape(pendingEscape);
        }
      }
    }

    function openModal(html) {
      document.getElementById("modal-body").innerHTML = html;

    function pxConfirm(opts) {
      const cfg = opts || {};
      const root = document.getElementById("confirm-modal-root");
      if (!root) return Promise.resolve(true);
      if (window._pxConfirmResolve) {
        try { window._pxConfirmResolve(false); } catch (_) {}
      }
      SFX.tick();
      return new Promise((resolve) => {
        let done = false;
        const finish = (ans) => {
          if (done) return;
          done = true;
          root.classList.remove("open");
          root.innerHTML = "";
          document.removeEventListener("keydown", onKey);
          window._pxConfirmResolve = null;
          if (!ans) SFX.tick();
          resolve(Boolean(ans));
        };
        const onKey = (ev) => {
          if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
          else if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
        };
        window._pxConfirmResolve = finish;
        window._pxConfirmDone = finish;
        document.addEventListener("keydown", onKey);
        const ico = cfg.icon || "warn";
        const toneCls = cfg.tone === "danger" ? "danger" : "";
        const btnCls = cfg.tone === "danger" ? "btn-danger" : (cfg.tone === "emerald" ? "btn-emerald" : "btn-gold");
        root.onclick = (e) => { if (e.target === root) finish(false); };
        root.innerHTML = `
          <div class="px-confirm-card ${toneCls}">
            <div class="px-confirm-head">
              <div class="px-confirm-ico">${pxIcon(ico, 22)}</div>
              <div>
                <div class="px-num" style="font-size:22px;line-height:1.05;color:${cfg.tone === "danger" ? "var(--px-coral)" : "var(--px-gold)"};">${esc(cfg.title || "XÁC NHẬN")}</div>
              </div>
            </div>
            <div style="font-size:13px;line-height:1.5;color:var(--px-text-2);">${esc(cfg.message || "")}</div>
            <div class="px-confirm-actions">
              <button type="button" class="btn btn-ghost" onclick="window._pxConfirmDone && window._pxConfirmDone(false)">${pxIcon("cross", 13)} ${esc(cfg.cancelText || "Hủy")}</button>
              <button type="button" class="btn ${btnCls}" onclick="window._pxConfirmDone && window._pxConfirmDone(true)">${pxIcon("check", 13)} ${esc(cfg.confirmText || "Xác nhận")}</button>
            </div>
          </div>`;
        root.classList.add("open");
      });
    }

    const PX_PICKERS = {};
    function pxChevronSvg() {
      return '<svg class="px-svg" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="2" y="4" width="2" height="2" fill="currentColor"/><rect x="4" y="6" width="4" height="2" fill="currentColor"/><rect x="8" y="4" width="2" height="2" fill="currentColor"/></svg>';
    }
    function registerPxPicker(key, cfg) {
      PX_PICKERS[key] = cfg;
    }
    function renderPxPickerBtn(key, opts) {
      const cfg = PX_PICKERS[key];
      const o = opts || {};
      const sel = cfg ? (cfg.options.find(x => String(x.value) === String(cfg.value)) || cfg.options.find(x => x.selected)) : null;
      const labelTxt = sel ? (sel.shortLabel || sel.label) : (o.placeholder || (cfg && cfg.placeholder) || "Chọn...");
      const cls = o.compact ? "px-picker-btn compact" : "px-picker-btn";
      const ico = o.prefixIcon ? pxIcon(o.prefixIcon, 13) : "";
      const prefixTxt = o.prefixLabel ? `<span class="muted">${esc(o.prefixLabel)}:</span>` : "";
      return `<button type="button" class="${cls}" data-picker="${esc(key)}" onclick="openPxPicker('${esc(key)}')"><span class="px-picker-label">${ico}${prefixTxt}<span>${esc(labelTxt)}</span></span><span class="px-picker-chev">${pxChevronSvg()}</span></button>`;
    }
    function renderPxPickerOptionsHtml(key, filterText) {
      const cfg = PX_PICKERS[key];
      if (!cfg) return "";
      const needle = String(filterText || "").trim().toLowerCase();
      const rows = cfg.options
        .map((opt, idx) => ({ opt, idx }))
        .filter(({ opt }) => !needle || String(opt.label || "").toLowerCase().includes(needle) || String(opt.sub || "").toLowerCase().includes(needle) || String(opt.badge || "").toLowerCase().includes(needle));
      if (!rows.length) return '<p class="muted" style="font-size:12.5px;margin:8px 0;">Không tìm thấy mục phù hợp.</p>';
      return rows.map(({ opt, idx }) => {
        const isSel = String(opt.value) === String(cfg.value) || Boolean(opt.selected);
        return `
          <button type="button" class="px-option-row ${isSel ? "selected" : ""}" onclick="selectPxPickerOption('${esc(key)}', ${idx})">
            <div class="wrap-row" style="flex:1;min-width:0;gap:10px;flex-wrap:nowrap;">
              ${opt.spriteHtml || ""}
              <div style="min-width:0;">
                <div style="font-weight:700;font-size:13px;color:${opt.color ? esc(opt.color) : "var(--px-text)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(opt.label)}</div>
                ${opt.sub ? `<div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(opt.sub)}</div>` : ""}
              </div>
            </div>
            <div class="wrap-row" style="flex-shrink:0;gap:6px;">
              ${opt.badge ? `<span class="tab-badge" style="${opt.color ? "color:" + esc(opt.color) + ";border-color:" + esc(opt.color) + ";" : ""}">${esc(opt.badge)}</span>` : ""}
              ${isSel ? `<span style="color:var(--px-mint);">${pxIcon("check", 14)}</span>` : ""}
            </div>
          </button>`;
      }).join("");
    }
    function filterPxPicker(key, val) {
      const list = document.getElementById("px-picker-list");
      if (list) list.innerHTML = renderPxPickerOptionsHtml(key, val);
    }
    function openPxPicker(key) {
      const cfg = PX_PICKERS[key];
      if (!cfg) return;
      SFX.tick();
      const showSearch = cfg.options.length >= 8;
      openModal(`

        <div id="px-picker-list" class="px-option-list">${renderPxPickerOptionsHtml(key, "")}</div>
      `);
    }
    function selectPxPickerOption(key, idx) {
      const cfg = PX_PICKERS[key];
      closeModal();

          <div class="hud-stat">
            <div class="hud-label"><span>${pxIcon("coin", 14)} RuCoin</span></div>

      const tabs = `

          <button class="rpg-tab ${APP.activeTab === "gear" ? "active" : ""}" onclick="switchTab('gear')">${pxIcon("sword", 16)} ${t("tabGear")}</button>
          <button class="rpg-tab ${APP.activeTab === "shop" ? "active" : ""}" onclick="switchTab('shop')">${pxIcon("shop", 16)} ${t("tabShop")}</button>
          <button class="rpg-tab ${APP.activeTab === "forge" ? "active" : ""}" onclick="switchTab('forge')">${pxIcon("anvil", 16)} ${t("tabForge")} ${st.skills.available_points > 0 ? `<span class="tab-badge">${st.skills.available_points} SP</span>` : ""}</button>
          <button class="rpg-tab ${APP.activeTab === "aqua" ? "active" : ""}" onclick="switchTab('aqua')">${pxIcon("aqua", 16)} ${t("tabAqua")} ${st.boss ? `<span class="tab-badge" style="color:var(--px-coral);">BOSS</span>` : ""}</button>

      let content = "";
      if (APP.activeTab === "fish") content = renderFishTab();
      else if (APP.activeTab === "bag") content = renderBagTab();
      else if (APP.activeTab === "gear") content = renderGearTab();
      else if (APP.activeTab === "shop") content = renderShopTab();
      else if (APP.activeTab === "forge") content = renderForgeTab();
      else if (APP.activeTab === "aqua") content = renderAquaTab();
      else content = renderCodexTab();

      const prevFocusId = document.activeElement && document.activeElement.id;
      const prevSelPos = prevFocusId === "bag-search-inp" ? document.activeElement.selectionStart : null;
      root.innerHTML = hud + tabs + content;
      if (prevFocusId === "bag-search-inp") {
        const inpEl = document.getElementById("bag-search-inp");
        if (inpEl) {

          if (typeof prevSelPos === "number") inpEl.setSelectionRange(prevSelPos, prevSelPos);

          HaruMiniGame.stop();

    function renderFishTab() {
      const st = APP.state;
      const eq = st.equipment;
      const isl = st.islands.find(i => i.id === st.current_island_id) || st.islands[0];
      const remMs = Math.max(0, APP.cooldownUntilMs - Date.now());
      const cdPct = remMs > 0 ? Math.max(0, Math.min(100, Math.round((1 - remMs / Math.max(500, APP.cooldownDurationMs || 1500)) * 100))) : 100;
      const ch = APP.activeChallenge;
      const ss = APP.sessionStats;

        const pv = ch.catch_preview || {};
        centerHtml = `
          <div style="width:100%;max-width:520px;" class="stack">

      } else if (APP.busyAction) {

        <div class="fish-sanctuary">
