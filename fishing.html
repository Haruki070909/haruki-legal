            <div class="island-banner">
              <div>
                <div style="font-size:11px;color:var(--px-mint);font-weight:700;letter-spacing:.05em;">BẾN CÂU · ${esc((isl && isl.id || "starter").replace("_island", "").toUpperCase())}</div>
                <div class="inline-ico" style="font-size:16px;font-weight:700;">${pxIcon("island", 17)} ${esc(isl ? isl.name : "Starter Island")}</div>
              </div>
              <div class="wrap-row">
                ${(st.boosts || []).map(b => `<span class="rarity-pill" style="color:var(--px-gold);">${pxIcon("bolt", 12)} ${esc(b.scope)} x${b.multiplier}</span>`).join("")}
                ${st.stats.potions_stock > 0 ? `<span class="rarity-pill" style="color:var(--px-violet);">${pxIcon("potion", 12)} Lọ Mutation ×${st.stats.potions_stock}</span>` : ""}
                <button type="button" class="btn btn-ghost btn-sm" onclick="openIslandQuickModal()">${pxIcon("boat", 13)} Đổi Đảo</button>
              </div>
            </div>

            <div id="px-stage-wrap" class="px-stage-wrap">
              <canvas id="px-ocean-canvas" width="384" height="210"></canvas>
              <div id="px-stage-flash"></div>
              <div class="stage-tag-bl">${stageTag}</div>
              ${ss.streak >= 2 ? `<div class="stage-streak-br">${pxIcon("bolt", 12)} STREAK ×${ss.streak}</div>` : ""}
            </div>

            <div class="stage-center">
              ${centerHtml}
              ${castBtn}
            </div>

            <div class="fish-quick-dock">
              <button type="button" class="dock-btn" onclick="openIslandQuickModal()">${pxIcon("island", 14)} Đổi Đảo</button>
              <button type="button" class="dock-btn" onclick="openBaitQuickModal()">${pxIcon("bait", 14)} ${eq.bait ? esc(eq.bait.name) + " ×" + eq.bait.quantity : "Chọn Mồi"}</button>
              <button type="button" class="dock-btn${APP.idleMode ? " idle-on" : ""}" onclick="toggleIdleFishing()">${pxIcon("bolt", 14)} ${APP.idleMode ? "Idle: ĐANG CHẠY" : "Idle Tự Động"}</button>
              <button type="button" class="dock-btn${afk.active ? (afk.completed ? " afk-ready" : " afk-active") : ""}" onclick="openAfkModal()">${pxIcon(afk.boost_tier === "pro" ? "afk_boost_pro" : "afk_boost", 15)} ${afk.active ? `<span id="afk-dock-clock">${afk.completed ? "NHẬN AFK!" : formatDurationHMS(afkRemNow)}</span>` : "Treo AFK 8H"}</button>
              <button type="button" class="dock-btn" onclick="openChallengeGuideModal()">${pxIcon("target", 14)} Tập Thử Thách</button>
              <button type="button" class="dock-btn gold" onclick="doSellAll()">${pxIcon("moneybag", 14)} Bán (${fmt(st.stats.kept_catches)})</button>
            </div>
          </div>

          <div class="fish-session-strip">
            <div class="inline-ico" style="font-size:12px;font-weight:700;">
              ${pxIcon("trophy", 14)}
              <span>Phiên: <strong class="px-num" style="font-size:16px;color:var(--px-mint);">${fmt(ss.catches)}</strong> cá</span>
              <span class="muted">·</span>
              <strong class="px-num" style="font-size:16px;color:var(--px-gold);">+${fmt(ss.totalValue)} RC</strong>
              ${ss.bestStreak >= 2 ? `<span class="tab-badge">Best ×${ss.bestStreak}</span>` : ""}
            </div>
            <div class="session-ticker">${recentHtml}</div>
          </div>
        </div>`;
    }

    function renderBagTab() {
      if (!APP.inventory) return `<div class="panel"><p class="muted">Đang tải túi đồ thật từ Discord...</p></div>`;
      const inv = APP.inventory;
      const subBtns = `
        <div class="toolbar">
          <div class="wrap-row">
            <button class="btn ${APP.bagSubTab === "fish" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.bagSubTab='fish';render();">${pxIcon("fish", 14)} Kho Cá (${inv.catches.length})</button>
            <button class="btn ${APP.bagSubTab === "items" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.bagSubTab='items';render();">${pxIcon("chest", 14)} Vật Phẩm & Rương (${inv.items.length})</button>
          </div>
          <div class="wrap-row">
            <div class="px-search-box">
              ${pxIcon("target", 13)}
              <input id="bag-search-inp" placeholder="Tìm tên..." value="${esc(APP.bagFilter)}" oninput="APP.bagFilter=this.value;render();" />
              ${APP.bagFilter ? `<button type="button" class="px-search-clear" onclick="APP.bagFilter='';render();">${pxIcon("cross", 12)}</button>` : ""}
            </div>
            <button class="btn btn-gold btn-sm" onclick="doSellAll()">${pxIcon("moneybag", 14)} ${t("sellAll")}</button>
          </div>
        </div>`;

      if (APP.bagSubTab === "fish") {
        const needle = APP.bagFilter.toLowerCase();
        const list = inv.catches.filter(c =>
          (!needle || c.name.toLowerCase().includes(needle) || (c.mutation_name || "").toLowerCase().includes(needle)) &&
          (APP.bagRarityFilter === "all" || c.rarity_id === APP.bagRarityFilter)
        );
        const rarities = Array.from(new Set(inv.catches.map(c => c.rarity_id)));
        registerPxPicker("bag_rarity", {
          title: "LỌC THEO ĐỘ HIẾM",
          icon: "fish",
          value: APP.bagRarityFilter,
          options: [
            { value: "all", label: `Mọi độ hiếm (${inv.catches.length})`, selected: APP.bagRarityFilter === "all" },
            ...rarities.map(r => ({
              value: r,
              label: r.toUpperCase(),
              badge: fmt(inv.catches.filter(x => x.rarity_id === r).length) + " cá",
              selected: APP.bagRarityFilter === r
            }))
          ],
          onSelect: (v) => { APP.bagRarityFilter = v; render(); }
        });
        const rarBar = `<div class="wrap-row" style="margin-bottom:12px;">
          <div style="min-width:190px;">${renderPxPickerBtn("bag_rarity", { prefixIcon: "fish" })}</div>
          ${APP.bagRarityFilter !== "all" ? `<button class="btn btn-gold btn-sm" onclick="doSellRarity('${esc(APP.bagRarityFilter)}')">Bán hết bậc ${esc(APP.bagRarityFilter)}</button>` : ""}
        </div>`;
        const cards = list.slice(0, 80).map(c => `
          <div class="sub-card">
            <div class="row-between">
              <div class="wrap-row" style="flex:1;min-width:0;">
                ${spriteHtml(c.image_path, c.emoji, true)}
                <div style="min-width:0;">
                  <div class="inline-ico" style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.locked ? pxIcon("lock", 12) + " " : ""}${esc(c.name)}</div>
                  <div class="wrap-row" style="gap:4px;margin-top:2px;">
                    <span class="rarity-pill" style="color:${esc(c.rarity_color)};">${esc(c.rarity_name)}</span>
                    ${c.mutation_name ? `<span class="rarity-pill" style="color:var(--px-violet);">${pxIcon("sparkle", 12)} ${esc(c.mutation_name)}</span>` : ""}
                    ${c.serial_number ? `<span class="rarity-pill" style="color:var(--px-gold);">#${c.serial_number}</span>` : ""}
                  </div>
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <div class="px-num" style="color:var(--px-gold);font-size:19px;">${fmt(c.value)} RC</div>
                <div class="muted" style="font-size:11px;">${c.weight} kg</div>
              </div>
            </div>
            <div class="wrap-row" style="margin-top:9px;justify-content:flex-end;">
              ${c.in_aquarium ? `<span class="tab-badge">Đang trong Thủy Cung</span>` : `
                <button class="btn btn-ghost btn-sm" onclick="doToggleLock('${esc(c.catch_id)}')">${c.locked ? pxIcon("unlock", 13) + " Mở khóa" : pxIcon("lock", 13) + " Khóa"}</button>
                <button class="btn btn-ghost btn-sm" onclick="doAquaAdd('${esc(c.catch_id)}')">${pxIcon("aqua", 13)} Nuôi</button>
                ${!c.locked ? `<button class="btn btn-gold btn-sm" onclick="doSellCatch('${esc(c.catch_id)}')">Bán</button>` : ""}
              `}
            </div>
          </div>`).join("");
        return `<div class="panel">${subBtns}${rarBar}<div class="grid-2">${cards || '<p class="muted">Túi cá trống.</p>'}</div></div>`;
      }

      const needle = APP.bagFilter.toLowerCase();
      const items = inv.items.filter(it => !needle || it.name.toLowerCase().includes(needle) || it.item_type.toLowerCase().includes(needle));
      const itemCards = items.map(it => {
        let actions = "";
        if (it.item_type === "chest") {
          actions += `<button class="btn btn-emerald btn-sm" onclick="doOpenChest('${esc(it.item_id)}',1)">${pxIcon("unlock", 13)} Mở ×1</button>`;
          if (it.quantity >= 5 && it.item_id !== "60_cosmic_transcendent_chest") {
            actions += `<button class="btn btn-ghost btn-sm" onclick="doOpenChest('${esc(it.item_id)}',5)">Mở ×5</button>`;
          }
        } else if (it.item_type === "rod" || it.item_type === "bait") {
          actions += `<button class="btn ${it.equipped ? "btn-ghost" : "btn-primary"} btn-sm" onclick="doEquip('${esc(it.item_type)}','${esc(it.item_id)}')">${it.equipped ? "Đang dùng " + pxIcon("check", 12) : "Trang bị"}</button>`;
        } else if (["gear", "hook", "reel"].includes(it.item_type)) {
          actions += `<button class="btn ${it.equipped ? "btn-ghost" : "btn-primary"} btn-sm" onclick="doEquip('gear','${esc(it.item_id)}')">${it.equipped ? "Đang mặc " + pxIcon("check", 12) : "Mặc ô " + esc(it.slot)}</button>`;
        } else if (it.item_type === "afk_boost") {
          actions += `<button class="btn btn-emerald btn-sm" onclick="openAfkModal()">${pxIcon("clock", 13)} Treo AFK 8H</button>`;
        }
        if (it.quantity > 1 && it.sell_unit_price > 0) {
          actions += `<button class="btn btn-ghost btn-sm" onclick="doSellItem('${esc(it.item_id)}')">Bán dư (${fmt(it.sell_unit_price * (it.quantity - 1))} RC)</button>`;
        }
        return `
          <div class="sub-card">
            <div class="row-between">
              <div class="wrap-row" style="flex:1;min-width:0;">
                ${itemSpriteHtml(it, true)}
                <div style="min-width:0;">
                  <div style="font-weight:700;font-size:13px;">${esc(it.name)} <span style="color:var(--px-cyan);">×${fmt(it.quantity)}</span></div>
                  <div class="muted" style="font-size:11px;">${esc(it.item_type.toUpperCase())}${it.rarity_name ? ` · ${esc(it.rarity_name)}` : ""}${it.forge_rank_name ? ` · ${esc(it.forge_rank_name)}` : ""}</div>
                  ${it.effect_label ? `<div class="muted" style="font-size:11px;margin-top:2px;">${esc(it.effect_label)}</div>` : ""}
                </div>
              </div>
            </div>
            <div class="wrap-row" style="margin-top:9px;justify-content:flex-end;">${actions}</div>
          </div>`;
      }).join("");
      return `<div class="panel">${subBtns}<div class="grid-2">${itemCards || '<p class="muted">Túi vật phẩm trống.</p>'}</div></div>`;
    }

    function renderGearTab() {
      const st = APP.state;
      const items = APP.inventory ? APP.inventory.items : [];
      const rods = items.filter(i => i.item_type === "rod");
      const baits = items.filter(i => i.item_type === "bait");
      const wearables = items.filter(i => ["gear", "hook", "reel"].includes(i.item_type));

      const slotNames = {
        head: `${pxIcon("hat", 13)} NÓN (HEAD)`,
        body: `${pxIcon("armor", 13)} GIÁP (BODY)`,
        ring: `${pxIcon("ring", 13)} NHẪN (RING)`,
        relic: `${pxIcon("relic", 13)} PHỤ KIỆN (RELIC)`
      };
      const slotCard = (slot) => {
        const eq = st.equipment.slots[slot];
        const choices = wearables.filter(w => w.slot === slot);
        if (choices.length) {
          registerPxPicker("gear_slot_" + slot, {
            title: "TRANG BỊ Ô " + slot.toUpperCase(),
            icon: slot === "head" ? "hat" : (slot === "body" ? "armor" : slot),
            value: eq ? eq.item_id : "",
            placeholder: `Chọn trang bị (${choices.length})`,
            options: choices.map(c => ({
              value: c.item_id,
              label: c.name,
              shortLabel: c.name + " (" + (c.forge_rank_name || "") + ")",
              sub: `${c.rarity_name || ""} · ${c.forge_rank_name || ""}${c.effect_label ? " · " + c.effect_label : ""}`,
              badge: c.forge_rank_name,
              spriteHtml: spriteHtml(c.image_path, c.emoji, true),
              selected: Boolean(eq && eq.item_id === c.item_id)
            })),
            onSelect: (v) => { if (v) doEquip("gear", v); }
          });
        }
        return `
          <div class="sub-card stack">
            <div class="row-between">
              <strong class="inline-ico" style="font-size:12px;color:var(--px-mint);">${slotNames[slot]}</strong>
              ${eq ? `<button class="btn btn-ghost btn-sm" onclick="doEquip('clear_slot','','${slot}')">Tháo</button>` : ""}
            </div>
            ${eq ? `<div class="wrap-row">${spriteHtml(eq.image_path, eq.emoji, true)}<div><div style="font-weight:700;font-size:13px;">${esc(eq.name)}</div><div class="muted" style="font-size:11px;">${esc(eq.rarity_name)} · ${esc(eq.forge_rank_name)} · ${esc(eq.effect_label)}</div></div></div>` : '<div class="muted" style="font-size:12px;">Ô trống</div>'}
            ${choices.length ? renderPxPickerBtn("gear_slot_" + slot, { placeholder: `Đổi trang bị (${choices.length})` }) : ""}
          </div>`;
      };

      const av = (APP.discordUser && APP.discordUser.avatar)
        ? `https://cdn.discordapp.com/avatars/${APP.discordUser.id}/${APP.discordUser.avatar}.png?size=64`
        : "./icons/fishing-app-icon-192.png";

      const equipDiagram = `
        <div class="px-equip-diagram">
          <div class="stack">${slotCard("head")}${slotCard("body")}</div>
          <div class="px-angler-core">
            <img src="${esc(av)}" alt="Angler" class="px-icon" />
            <div class="px-num" style="font-size:18px;color:var(--px-gold);">+${st.stats.effective_luck} LUCK</div>
            <div class="muted" style="font-size:10.5px;">${fmt(st.stats.max_weight_kg)} kg</div>
          </div>
          <div class="stack">${slotCard("ring")}${slotCard("relic")}</div>
        </div>`;

      const islandsHtml = st.islands.map(isl => `
        <div class="sub-card stack" style="${isl.current ? "border-color:var(--px-mint);" : ""}">
          <div class="row-between">
            <strong style="font-size:13.5px;">${isl.order}. ${esc(isl.name)}</strong>
            <span class="rarity-pill" style="color:${isl.unlocked ? "#6fdbbf" : "#84a0bd"};">${isl.current ? "ĐANG Ở ĐÂY" : (isl.unlocked ? "ĐÃ MỞ" : "CHƯA MỞ")}</span>
          </div>
          <div class="muted inline-ico" style="font-size:11.5px;">${pxIcon("book", 13)} Bộ sưu tập: <strong>${isl.bestiary_found}/${isl.bestiary_total}</strong> ${isl.bestiary_complete ? pxIcon("sparkle", 12) + " (+5% Luck)" : ""}</div>
          <div class="muted inline-ico" style="font-size:11.5px;">${pxIcon("rod", 13)} Khuyên dùng: ${esc(isl.recommended_rods || "Tùy chọn")}</div>
          ${!isl.unlocked ? `<div style="font-size:11.5px;color:var(--px-gold);">Điều kiện: ${esc(isl.requirements_text || "Lv." + isl.level_required)}${isl.unlock_cost ? ` · Phí ${fmt(isl.unlock_cost)} RC` : ""}</div>` : ""}
          <div class="row-between" style="margin-top:auto;">
            ${isl.unlocked
              ? `<button class="btn ${isl.current ? "btn-ghost" : "btn-primary"} btn-sm" ${isl.current ? "disabled" : ""} onclick="doTravelIsland('${esc(isl.id)}')">${isl.current ? "Đang câu tại đây" : pxIcon("boat", 14) + " Di chuyển tới"}</button>`
              : `<button class="btn btn-emerald btn-sm" onclick="doUnlockIsland('${esc(isl.id)}')">${pxIcon("key", 14)} Mở khóa đảo</button>`}
          </div>
        </div>`).join("");

      registerPxPicker("gear_rod", {
        title: "CHỌN CẦN CÂU",
        icon: "rod",
        value: st.equipment.rod ? st.equipment.rod.item_id : "",
        placeholder: "Chưa có cần",
        options: rods.map(r => ({
          value: r.item_id,
          label: r.name,
          shortLabel: `${r.name} · ${r.forge_rank_name || ""}`,
          sub: `${r.rarity_name || ""} · ${r.forge_rank_name || ""} · +${r.luck || 0} Luck`,
          badge: r.forge_rank_name,
          spriteHtml: spriteHtml(r.image_path, r.emoji, true),
          selected: Boolean(st.equipment.rod && st.equipment.rod.item_id === r.item_id)
        })),
        onSelect: (v) => { if (v) doEquip("rod", v); }
      });
      registerPxPicker("gear_bait", {
        title: "CHỌN MỒI CÂU",
        icon: "bait",
        value: st.equipment.bait ? st.equipment.bait.item_id : "__none",
        options: [
          { value: "__none", label: "Không dùng mồi", selected: !st.equipment.bait },
          ...baits.map(b => ({
            value: b.item_id,
            label: b.name,
            shortLabel: `${b.name} (+${b.luck || 0} Luck · ×${b.quantity})`,
            sub: `+${b.luck || 0} Luck · Còn ×${fmt(b.quantity)}`,
            badge: "×" + fmt(b.quantity),
            spriteHtml: spriteHtml(b.image_path, b.emoji, true),
            selected: Boolean(st.equipment.bait && st.equipment.bait.item_id === b.item_id)
          }))
        ],
        onSelect: (v) => {
          if (v === "__none") doEquip("clear_bait", "");
          else if (v) doEquip("bait", v);
        }
      });

      return `
        <div class="stack">
          <div class="panel stack">
            <div class="row-between">
              <h3 class="px-num inline-ico" style="margin:0;font-size:24px;color:var(--px-mint);">${pxIcon("sword", 18)} BẢNG TRANG BỊ CẦN THỦ</h3>
              <button class="btn btn-ghost btn-sm" onclick="doEquip('clear_bait','')">Bỏ mồi</button>
            </div>
            <div class="grid-2">
              <div class="sub-card stack">
                <strong class="inline-ico" style="font-size:12.5px;">${pxIcon("rod", 14)} Cần Câu (${rods.length} sở hữu)</strong>
                ${rods.length ? renderPxPickerBtn("gear_rod", { prefixIcon: "rod" }) : '<div class="muted" style="font-size:12px;">Chưa có cần</div>'}
              </div>
              <div class="sub-card stack">
                <strong class="inline-ico" style="font-size:12.5px;">${pxIcon("bait", 14)} Mồi Câu (${baits.length} loại)</strong>
                ${renderPxPickerBtn("gear_bait", { prefixIcon: "bait" })}
              </div>
            </div>
            ${equipDiagram}
          </div>

          <div class="panel">
            <h3 class="px-num inline-ico" style="margin:0 0 12px;font-size:24px;color:var(--px-gold);">${pxIcon("island", 18)} HÀNH TRÌNH 6 HÒN ĐẢO</h3>
            <div class="grid-3">${islandsHtml}</div>
          </div>
        </div>`;
    }

    function renderShopTab() {
      if (!APP.shop) return `<div class="panel"><p class="muted">Đang tải cửa hàng thật từ Discord...</p></div>`;
      const items = APP.shop.items.filter(it => APP.shopFilter === "all" || it.item_type === APP.shopFilter);
      const typeCats = [
        ["all", "Tất cả"], ["afk_boost", "Boost AFK 8H"], ["rod", "Cần câu"], ["bait", "Mồi câu"],
        ["fish_lock", "Ổ khóa cá"], ["key", "Chìa khóa rương"],
        ["lockpick", "Cậy khóa"], ["mutation_potion", "Thuốc Mutation"]
      ];
      const filters = `<div class="wrap-row" style="margin-bottom:14px;">${typeCats.map(([k, l]) => `<button class="btn ${APP.shopFilter === k ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.shopFilter='${k}';render();">${l}</button>`).join("")}</div>`;
      const cards = items.map(it => {
        const artMeta = CUSTOM_ITEM_ART[it.item_id];
        const cardCls = it.item_type === "afk_boost"
          ? "sub-card stack shop-card-featured"
          : (artMeta ? "sub-card stack shop-card-key" : "sub-card stack");
        const tagPill = artMeta
          ? `<span class="rarity-pill" style="margin-bottom:4px;color:${it.item_type === "afk_boost" ? "var(--px-mint)" : "var(--px-gold)"};">${esc(artMeta.tag)}</span>`
          : "";
        return `
        <div class="${cardCls}">
          <div class="wrap-row" style="flex:1;min-width:0;align-items:flex-start;">
            ${itemSpriteHtml(it, false)}
            <div style="min-width:0;flex:1;">
              ${tagPill}
              <div style="font-weight:700;font-size:13.5px;">${esc(it.name)}</div>
              <div class="muted" style="font-size:11px;margin-top:2px;">${it.luck ? `+${it.luck} Luck · ` : ""}${it.max_weight_kg ? `${fmt(it.max_weight_kg)} kg · ` : ""}Đang có: <strong style="color:var(--px-cyan);">${fmt(it.owned)}</strong></div>
            </div>
          </div>
          ${it.description ? `<div class="muted" style="font-size:11.5px;line-height:1.45;">${esc(it.description)}</div>` : ""}
          <div class="row-between" style="margin-top:auto;padding-top:6px;">
            <strong class="px-num" style="color:var(--px-gold);font-size:20px;">${fmt(it.cost)} RC</strong>
            <div class="wrap-row" style="gap:6px;">
              <div class="px-stepper">
                <button type="button" class="px-step-btn" onclick="stepShopQty('${esc(it.item_id)}', -1)">-</button>
                <input id="qty-${esc(it.item_id)}" type="text" inputmode="numeric" value="${APP.shopQty[it.item_id] || 1}" class="px-step-val" oninput="setShopQty('${esc(it.item_id)}', this.value)" />
                <button type="button" class="px-step-btn right" onclick="stepShopQty('${esc(it.item_id)}', 1)">+</button>
                <button type="button" class="px-step-btn right" style="font-size:14px;color:var(--px-gold);" onclick="stepShopQty('${esc(it.item_id)}', 10)">+10</button>
              </div>
              <button class="btn btn-primary btn-sm" onclick="doBuyItem('${esc(it.item_id)}')">Mua</button>
            </div>
          </div>
        </div>`;
      }).join("");
      return `<div class="panel"><h3 class="px-num inline-ico" style="margin:0 0 12px;font-size:24px;color:var(--px-gold);">${pxIcon("shop", 18)} CỬA HÀNG CÂU CÁ</h3>${filters}<div class="grid-3">${cards}</div></div>`;
    }

    function renderForgeTab() {
      const st = APP.state;
      const ws = APP.workshop;
      const nav = `
        <div class="wrap-row" style="margin-bottom:14px;">
          <button class="btn ${APP.forgeSubTab === "recipes" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.forgeSubTab='recipes';render();">${pxIcon("wrench", 14)} Chế Tạo Cần (${ws ? ws.recipes.length : 0})</button>
          <button class="btn ${APP.forgeSubTab === "upgrade" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.forgeSubTab='upgrade';render();">${pxIcon("anvil", 14)} Nâng Rank / Rarity / Ghép</button>
          <button class="btn ${APP.forgeSubTab === "skills" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.forgeSubTab='skills';render();">${pxIcon("star", 14)} Kỹ Năng (${st.skills.available_points} SP)</button>
        </div>`;

      if (APP.forgeSubTab === "recipes") {
        if (!ws) return `<div class="panel">${nav}<p class="muted">Đang tải xưởng chế tạo...</p></div>`;
        const cards = ws.recipes.map(r => `
          <div class="sub-card stack">
            <div class="wrap-row">
              ${spriteHtml(r.image_path, r.emoji, true)}
              <div>
                <div style="font-weight:700;font-size:13.5px;">${esc(r.name)} ×${r.output_quantity}</div>
                <div class="px-num" style="font-size:18px;color:var(--px-gold);">Phí: ${fmt(r.cost)} RC</div>
              </div>
            </div>
            <div class="stack" style="gap:4px;">
              ${r.required_rod_name ? `<div class="inline-ico" style="font-size:11.5px;">${r.rod_ok ? pxIcon("check", 12) : pxIcon("cross", 12)} Cần: <strong>${esc(r.required_rod_name)}</strong></div>` : ""}
              ${r.materials.map(m => `<div class="inline-ico" style="font-size:11.5px;">${m.have >= m.need ? pxIcon("check", 12) : pxIcon("cross", 12)} ${esc(m.name)}: <strong>${m.have}/${m.need}</strong></div>`).join("")}
            </div>
            <button class="btn ${r.materials_ok && r.rod_ok ? "btn-emerald" : "btn-ghost"} btn-sm" style="margin-top:auto;" onclick="doCraft('${esc(r.recipe_id)}')">${pxIcon("wrench", 13)} Chế tạo</button>
          </div>`).join("");
        return `<div class="panel">${nav}<div class="grid-3">${cards}</div></div>`;
      }

      if (APP.forgeSubTab === "upgrade") {
        if (!ws) return `<div class="panel">${nav}<p class="muted">Đang tải...</p></div>`;
        const eqList = ws.equipment || [];
        if (!APP.selectedGearItemId && eqList.length) APP.selectedGearItemId = eqList[0].item_id;
        const sel = eqList.find(e => e.item_id === APP.selectedGearItemId) || eqList[0];
        const phoiPool = sel && sel.item_type !== "rod"
          ? eqList.filter(e => e.item_type !== "rod" && e.rarity_step === sel.rarity_step && (e.item_id !== sel.item_id || e.quantity >= 2))
          : [];
        if (sel) {
          registerPxPicker("forge_main", {
            title: "CHỌN ĐỒ CẦN NÂNG / RÈN",
            icon: "anvil",
            value: sel.item_id,
            options: eqList.map(e => ({
              value: e.item_id,
              label: e.name,
              shortLabel: `[${e.item_type.toUpperCase()}] ${e.name} · ${e.rarity_name} (${e.rank_name})`,
              sub: `${e.item_type.toUpperCase()} · ${e.rarity_name} · Rank ${e.rank_name} (×${e.quantity})`,
              badge: e.rank_name,
              spriteHtml: spriteHtml(e.image_path, e.emoji, true),
              selected: e.item_id === sel.item_id
            })),
            onSelect: (v) => { APP.selectedGearItemId = v; APP.selectedPhoiItemId = ""; render(); }
          });
        }
        if (phoiPool.length) {
          if (!APP.selectedPhoiItemId || !phoiPool.some(p => p.item_id === APP.selectedPhoiItemId)) {
            APP.selectedPhoiItemId = phoiPool[0].item_id;
          }
          registerPxPicker("forge_phoi", {
            title: "CHỌN TRANG BỊ LÀM PHÔI",
            icon: "anvil",
            value: APP.selectedPhoiItemId,
            options: phoiPool.map(p => ({
              value: p.item_id,
              label: p.name,
              shortLabel: `Phôi: ${p.name} (×${p.quantity})`,
              sub: `${p.rarity_name || ""} · Rank ${p.rank_name || ""}`,
              badge: "×" + p.quantity,
              spriteHtml: spriteHtml(p.image_path, p.emoji, true),
              selected: p.item_id === APP.selectedPhoiItemId
            })),
            onSelect: (v) => { APP.selectedPhoiItemId = v; render(); }
          });
        } else {
          APP.selectedPhoiItemId = "";
        }

        return `
          <div class="panel stack">
            ${nav}
            ${!sel ? '<p class="muted">Bạn chưa có cần hoặc trang bị để nâng cấp.</p>' : `
              <div class="sub-card stack">
                <label class="muted" style="font-size:12px;">Chọn cần câu hoặc trang bị cần nâng:</label>
                ${renderPxPickerBtn("forge_main", { prefixIcon: "anvil" })}
                <div class="wrap-row" style="margin-top:8px;">
                  ${spriteHtml(sel.image_path, sel.emoji, false)}
                  <div>
                    <div style="font-size:16px;font-weight:700;">${esc(sel.name)}</div>
                    <div class="wrap-row" style="margin-top:4px;">
                      <span class="rarity-pill" style="color:var(--px-cyan);">Rank ${esc(sel.rank_name)}</span>
                      <span class="rarity-pill" style="color:var(--px-gold);">${esc(sel.rarity_name)}</span>
                    </div>
                    <div class="muted wrap-row" style="font-size:11.5px;margin-top:6px;gap:6px;">
                      <span>Tỉ lệ mỗi lần:</span>
                      <span class="inline-ico">${pxIcon("sparkle", 12)} 60% Lên</span>
                      <span>·</span>
                      <span class="inline-ico">${pxIcon("puff", 12)} 35% Hụt</span>
                      <span>·</span>
                      <span class="inline-ico">${pxIcon("down_arrow", 12)} 5% Tụt (F-/F không tụt)</span>
                    </div>
                  </div>
                </div>
                <div class="grid-2" style="margin-top:10px;">
                  <button class="btn btn-primary" onclick="doUpgradeRank('${esc(sel.item_id)}')">${pxIcon("anvil", 15)} Nâng Rank (${fmt(sel.rank_fee)} RC)</button>
                  <button class="btn ${sel.can_upgrade_rarity ? "btn-gold" : "btn-ghost"}" ${sel.rarity_step >= 7 ? "disabled" : ""} onclick="doUpgradeRarity('${esc(sel.item_id)}')">
                    ${sel.rarity_step >= 7 ? `${pxIcon("crown", 15)} Đã đạt Transcendent` : `${pxIcon("sparkle", 15)} Lên ${esc(sel.next_rarity_name)} (Cần Rank ${esc(sel.required_rank_name)} · ${fmt(sel.rarity_fee)} RC)`}
                  </button>
                </div>
                ${sel.item_type !== "rod" ? `
                  <div style="border-top:2px solid var(--px-border);margin-top:10px;padding-top:12px;" class="stack">
                    <div class="inline-ico" style="font-weight:700;font-size:13px;">${pxIcon("anvil", 14)} Ghép 2 Trang Bị Cùng Rarity (Tiêu hao 1 phôi)</div>
                    ${phoiPool.length ? `
                      <div class="wrap-row" style="align-items:stretch;">
                        <div style="flex:1;min-width:200px;">${renderPxPickerBtn("forge_phoi", { prefixIcon: "wrench" })}</div>
                        <button class="btn btn-emerald" onclick="doForgeGear('${esc(sel.item_id)}')">Ghép (${fmt(sel.forge_fee)} RC)</button>
                      </div>` : '<div class="muted" style="font-size:12px;">Cần ít nhất 2 trang bị cùng Rarity trong túi để làm phôi.</div>'}
                  </div>` : ""}
              </div>`}
          </div>`;
      }

      const sk = st.skills;
      const skillCards = sk.items.map(s => `
        <div class="sub-card stack">
          <div class="row-between">
            <strong style="font-size:13.5px;">${esc(APP.lang === "en" ? s.name_en : s.name_vi)}</strong>
            <span class="tab-badge">${s.level}${s.max_level ? "/" + s.max_level : "/∞"}</span>
          </div>
          <div class="muted" style="font-size:11.5px;">${esc(APP.lang === "en" ? s.desc_en : s.desc_vi)}</div>
          <div class="row-between" style="margin-top:auto;">
            <span class="muted inline-ico" style="font-size:11.5px;">${s.next_cost !== null ? `Cần: <strong>${s.next_cost} SP</strong>` : `${pxIcon("crown", 13)} Tối đa`}</span>
            ${s.next_cost !== null ? `<div class="wrap-row"><button class="btn btn-primary btn-sm" ${!s.can_upgrade ? "disabled" : ""} onclick="doUpgradeSkill('${esc(s.id)}',1)">+1</button><button class="btn btn-ghost btn-sm" onclick="doUpgradeSkill('${esc(s.id)}',5)">+5</button></div>` : ""}
          </div>
        </div>`).join("");

      const skipCards = ["legendary", "mythic"].map(r => {
        const unlocked = sk.minigame_skips.includes(r);
        const cost = sk.skip_costs[r] || 0;
        return `
          <div class="sub-card row-between">
            <div><strong class="inline-ico">${pxIcon("target", 14)} Bỏ qua Minigame ${r.toUpperCase()}</strong><div class="muted" style="font-size:11.5px;">Giá: ${fmt(cost)} RC</div></div>
            ${unlocked ? '<span class="rarity-pill" style="color:var(--px-mint);">ĐÃ MỞ</span>' : `<button class="btn btn-gold btn-sm" onclick="doUnlockSkip('${r}')">Mở khóa</button>`}
          </div>`;
      }).join("");

      return `
        <div class="panel stack">
          ${nav}
          <div class="row-between">
            <div><strong class="inline-ico">${pxIcon("sparkle", 15)} Điểm Kỹ Năng còn lại: <span class="px-num" style="color:var(--px-gold);font-size:22px;">${fmt(sk.available_points)}</span></strong> <span class="muted">(Đã dùng ${sk.spent_points}/${sk.earned_points})</span></div>
          </div>
          <div class="grid-3">${skillCards}</div>
          <h4 class="inline-ico" style="margin:8px 0 0;color:var(--px-mint);">${pxIcon("target", 15)} Mở Khóa Vĩnh Viễn Bỏ Minigame</h4>
          <div class="grid-2">${skipCards}</div>
        </div>`;
    }

    function renderAquaTab() {
      const st = APP.state;
      const aq = APP.aquarium;
      const boss = st.boss;

      const bossCard = `
        <div class="panel stack" style="border-color:${boss ? "var(--px-coral)" : "var(--px-border)"};">
          <div class="row-between">
            <h3 class="px-num inline-ico" style="margin:0;font-size:24px;color:var(--px-coral);">${pxIcon("dragon", 19)} WORLD BOSS RAID</h3>
            ${boss ? `<span class="rarity-pill" style="color:var(--px-coral);">Còn ${Math.floor(boss.remaining_seconds / 60)}m</span>` : ""}
          </div>
          ${boss ? `
            <div class="sub-card stack">
              <div class="row-between">
                <strong style="font-size:15px;">${esc(boss.name)}</strong>
                <strong class="px-num" style="color:var(--px-gold);font-size:20px;">Thưởng: ${fmt(boss.reward)} RC</strong>
              </div>
              <div class="xp-track" style="height:12px;"><div class="xp-fill" style="width:${Math.round((boss.hp / Math.max(1, boss.max_hp)) * 100)}%;background:linear-gradient(90deg,#f45b69,#ecc570);"></div></div>
              <div class="row-between muted" style="font-size:12px;">
                <span class="px-num" style="font-size:17px;">HP: ${fmt(boss.hp)} / ${fmt(boss.max_hp)}</span>
                <span class="px-num" style="font-size:17px;">Sát thương: ${fmt(boss.my_damage)}</span>
              </div>
              <button class="btn btn-danger" onclick="doBossFight()">${pxIcon("sword", 15)} ${t("attackBoss")}</button>
            </div>` : '<p class="muted" style="margin:0;">Hiện chưa có Boss nào được triệu hồi trong server (Admin dùng lệnh /fishboss trong Discord để gọi Boss).</p>'}
        </div>`;

      if (!aq) return `<div class="stack">${bossCard}<div class="panel"><p class="muted">Đang tải Thủy Cung...</p></div></div>`;

      const placedHtml = aq.placed.map(p => `
        <div class="sub-card row-between">
          <div>
            <div style="font-weight:700;font-size:13px;">${esc(p.name)} ${p.mutation_name ? `<span style="color:var(--px-violet);">· ${esc(p.mutation_name)}</span>` : ""}</div>
            <div class="muted" style="font-size:11.5px;">+${fmt(p.hourly)} RC/giờ · Tích lũy: <strong style="color:var(--px-gold);">${fmt(p.accrued)} RC</strong></div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="doAquaRemove('${esc(p.catch_id)}')">Lấy ra</button>
        </div>`).join("");

      if (aq.candidates.length) {
        if (!APP.selectedAquaCatchId || !aq.candidates.some(c => c.catch_id === APP.selectedAquaCatchId)) {
          APP.selectedAquaCatchId = aq.candidates[0].catch_id;
        }
        registerPxPicker("aqua_add", {
          title: "CHỌN CÁ THẢ THỦY CUNG",
          icon: "aqua",
          value: APP.selectedAquaCatchId,
          options: aq.candidates.slice(0, 50).map(c => ({
            value: c.catch_id,
            label: c.name,
            shortLabel: `${c.name} · ${c.weight}kg (${c.rarity_id})`,
            sub: `${c.weight} kg · ${c.rarity_id}${c.mutation_name ? " · " + c.mutation_name : ""}`,
            badge: String(c.rarity_id || "").toUpperCase(),
            selected: c.catch_id === APP.selectedAquaCatchId
          })),
          onSelect: (v) => { APP.selectedAquaCatchId = v; render(); }
        });
      }

      return `
        <div class="stack">
          ${bossCard}
          <div class="panel stack">
            <div class="toolbar" style="margin:0;">
              <div>
                <h3 class="px-num inline-ico" style="margin:0;font-size:24px;color:var(--px-mint);">${pxIcon("aqua", 19)} THỦY CUNG (${aq.placed.length}/${aq.capacity} Ô)</h3>
                <div class="muted" style="font-size:12px;">Tạo +1% giá cá/giờ (+${fmt(aq.total_hourly)} RC/giờ · Tích lũy: <strong style="color:var(--px-gold);">${fmt(aq.total_accrued)} RC</strong>)</div>
              </div>
              <button class="btn btn-gold" ${aq.total_accrued <= 0 ? "disabled" : ""} onclick="doAquaCollect()">${pxIcon("moneybag", 15)} ${t("collectAqua")} (+${fmt(aq.total_accrued)})</button>
            </div>
            ${aq.candidates.length ? `
              <div class="wrap-row" style="align-items:stretch;">
                <div style="flex:1;min-width:200px;">${renderPxPickerBtn("aqua_add", { prefixIcon: "fish" })}</div>
                <button class="btn btn-emerald btn-sm" onclick="doAquaAdd(APP.selectedAquaCatchId)">${pxIcon("plus", 13)} Thả cá vào bể</button>
              </div>` : ""}
            <div class="grid-2">${placedHtml || '<p class="muted">Chưa có cá nào trong Thủy Cung.</p>'}</div>
          </div>
        </div>`;
    }

    function renderCodexTab() {
      const nav = `
        <div class="wrap-row" style="margin-bottom:14px;">
          <button class="btn ${APP.codexSubTab === "bestiary" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.codexSubTab='bestiary';switchTab('codex');">${pxIcon("book", 14)} Bộ Sưu Tập Cá</button>
          <button class="btn ${APP.codexSubTab === "leaderboard" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.codexSubTab='leaderboard';switchTab('codex');">${pxIcon("trophy", 14)} Bảng Xếp Hạng Global</button>
        </div>`;

      if (APP.codexSubTab === "bestiary") {
        if (!APP.collection) return `<div class="panel">${nav}<p class="muted">Đang tải bộ sưu tập...</p></div>`;
        const isls = APP.collection.islands || [];
        const activeIsl = isls.find(i => i.island_id === APP.selectedCollectionIsland) || isls[0];
        const pills = isls.map(i => `<button class="btn ${activeIsl && activeIsl.island_id === i.island_id ? "btn-primary" : "btn-ghost"} btn-sm" onclick="APP.selectedCollectionIsland='${esc(i.island_id)}';render();">${esc(i.island_name.split("&")[0].trim())} (${i.discovered}/${i.total})</button>`).join("");
        const grid = activeIsl ? activeIsl.species.map(sp => `
          <div class="sub-card" style="opacity:${sp.discovered ? 1 : 0.45};">
            <div class="wrap-row">
              ${spriteHtml(sp.image_path, sp.emoji, true)}
              <div style="min-width:0;">
                <div class="inline-ico" style="font-weight:700;font-size:12.5px;">${sp.discovered ? pxIcon("check", 12) : pxIcon("question", 12)} ${esc(sp.name)}</div>
                <span class="rarity-pill" style="color:${esc(sp.rarity_color)};margin-top:3px;">${esc(sp.rarity_name)}</span>
                <div class="muted" style="font-size:11px;margin-top:2px;">Đã bắt: ${fmt(sp.caught_count)}</div>
              </div>
            </div>
          </div>`).join("") : "";
        return `<div class="panel stack">${nav}<div class="wrap-row">${pills}</div><div class="grid-3">${grid}</div></div>`;
      }

      const lbCats = [
        ["level", `${pxIcon("trophy", 13)} Level`], ["rucoin", `${pxIcon("coin", 13)} RuCoin`],
        ["best_fish", `${pxIcon("gem", 13)} Cá đắt nhất`], ["heaviest_fish", `${pxIcon("whale", 13)} Cá nặng nhất`],
        ["catches", `${pxIcon("rod", 13)} Tổng lượt bắt`], ["daily", `${pxIcon("calendar", 13)} Hôm nay`], ["luck", `${pxIcon("clover", 13)} Lucky Buff`]
      ];
      const catBtns = `<div class="wrap-row" style="margin-bottom:14px;">${lbCats.map(([k, l]) => `<button class="btn ${APP.lbCategory === k ? "btn-primary" : "btn-ghost"} btn-sm" onclick="refreshLeaderboard('${k}')">${l}</button>`).join("")}</div>`;
      const rows = APP.leaderboard ? (APP.leaderboard.entries || []).map((e, idx) => `
        <div class="sub-card row-between" style="${e.user_id === APP.discordUser.id ? "border-color:var(--px-mint);" : ""}">
          <div class="wrap-row">
            <strong class="px-num inline-ico" style="width:28px;font-size:20px;justify-content:center;color:${idx < 3 ? "var(--px-gold)" : "var(--px-muted)"};">${idx === 0 ? pxIcon("medal_1", 20) : idx === 1 ? pxIcon("medal_2", 20) : idx === 2 ? pxIcon("medal_3", 20) : "#" + (idx + 1)}</strong>
            <strong>${esc(e.name)}</strong>
          </div>
          <span style="font-weight:700;color:var(--px-text-2);font-size:12.5px;">${esc(e.detail)}</span>
        </div>`).join("") : '<p class="muted">Đang tải bảng xếp hạng...</p>';
      return `<div class="panel">${nav}${catBtns}<div class="stack">${rows || '<p class="muted">Chưa có dữ liệu.</p>'}</div></div>`;
    }

    setInterval(() => {
      if (!APP.state) return;
      const wEl = document.getElementById("fish-weather-rem");
      if (wEl && APP.state.weather) {
        const wRem = Math.max(0, Math.round((APP.weatherExpiresMs - Date.now()) / 1000));
        const txt = `${Math.floor(wRem / 60)}:${String(wRem % 60).padStart(2, "0")}`;
        wEl.textContent = APP.activeTab === "fish" ? `(${txt})` : txt;
      }
      if (APP.afkEndsMs > 0 && APP.state.afk && APP.state.afk.active) {
        const afkRem = Math.max(0, Math.round((APP.afkEndsMs - Date.now()) / 1000));
        const dur = Math.max(60, Number(APP.state.afk.duration_seconds || 28800));
        const elapsedNow = Math.max(0, dur - afkRem);
        APP.state.afk.remaining_seconds = afkRem;
        APP.state.afk.elapsed_seconds = elapsedNow;
        if (elapsedNow >= 60) APP.state.afk.can_claim = true;
        const dockClock = document.getElementById("afk-dock-clock");
        if (dockClock) dockClock.textContent = afkRem > 0 ? formatDurationHMS(afkRem) : "NHẬN AFK!";
        const modalClock = document.getElementById("afk-modal-clock");
        if (modalClock) modalClock.textContent = afkRem > 0 ? formatDurationHMS(afkRem) : "HOÀN TẤT 8/8 GIỜ!";
        const modalBar = document.getElementById("afk-modal-bar");
        if (modalBar) modalBar.style.width = `${Math.min(100, Math.round((elapsedNow / dur) * 100))}%`;
        if (afkRem === 0 && !APP.state.afk.completed) {
          APP.state.afk.completed = true;
          APP.state.afk.can_claim = true;
          render();
          if (document.getElementById("modal-root") && document.getElementById("modal-root").classList.contains("open") && modalClock) {
            openAfkModal();
          }
        }
      }
      if (APP.activeTab !== "fish" || APP.busyCast || APP.busyAction) return;
      const btn = document.getElementById("cast-btn-live");
      if (!btn) return;
      const remMs = Math.max(0, APP.cooldownUntilMs - Date.now());
      const lbl = btn.querySelector(".cast-label");
      if (remMs > 0) {
        const pct = Math.max(0, Math.min(100, Math.round((1 - remMs / Math.max(500, APP.cooldownDurationMs || 1500)) * 100)));
        btn.disabled = true;
        btn.style.setProperty("--cd-pct", pct + "%");
        if (lbl) lbl.innerHTML = `${pxIcon("clock", 20)} ${(remMs / 1000).toFixed(1)}S`;
      } else if (btn.disabled) {
        btn.disabled = false;
        btn.style.setProperty("--cd-pct", "100%");
        if (lbl) lbl.innerHTML = `${pxIcon("rod", 22)} ${esc(t("castBtn"))}`;
      }
    }, 150);

    document.addEventListener("keydown", (ev) => {
      if (ev.code === "Space" && APP.activeTab === "fish" && APP.state && APP.state.user.tos_accepted && !APP.activeChallenge && !APP.state.pending_catch && !(window.HaruMiniGame && HaruMiniGame.isActive())) {
        const tag = (document.activeElement && document.activeElement.tagName) || "";
        if (!["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(tag)) {
          ev.preventDefault();
          doCast();
        }
      }
    });

    bootstrap();
  </script>
</body>
</html>
